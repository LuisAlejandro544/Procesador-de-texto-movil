[package]
name = "docusheet-core"
version = "0.1.0"
edition = "2021"
authors = ["DocuSheet Team"]
description = "Motor de texto de alto rendimiento en Rust para DocuSheet: Piece Table, Rope y paginación en cascada continua"
license = "Proprietary"

[lib]
name = "docusheet_rust"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Puente seguro de interoperabilidad con C++20 de cero costo
cxx = "1.0"

# Serialización y deserialización para modelos de documento y estado
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
